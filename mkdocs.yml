site_name: Reserves PE
site_url: https://burguenopablo7-sketch.github.io/reserves-pe/

theme:
  name: material
  language: ca
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - navigation.instant
    - navigation.tracking
    - header.autohide
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro

nav:
  - Inici: index.md

markdown_extensions:
  - pymdownx.highlight:
      linenums: true
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - toc:
      permalink: true
  - admonitionS