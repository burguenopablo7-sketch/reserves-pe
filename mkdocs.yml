site_name: Reserves PE
site_url: https://burguenopablo7-sketch.github.io/reserves-pe/
use_directory_urls: true

docs_dir: docs
site_dir: site

theme:
  name: material
  language: ca
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - navigation.instant
    - navigation.tracking
    - header.autohide
  palette:
    - scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro

nav:
  - Inici: index.md
  - Colaboradors: grup.md
  - Què és MkDocs?: config.md

extra_css:
  - css/extra.css

markdown_extensions:
  - pymdownx.highlight:
      linenums: true
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - toc:
      permalink: true
  - admonition
