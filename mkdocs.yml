site_name: Documentació del Projecte
site_url: https://burguenopablo7-sketch.github.io/reserves-pe/

theme:
  name: material
  language: ca
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - navigation.instant
    - navigation.tracking
    - header.autohide
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Canviar a mode fosc
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Canviar a mode clar

nav:
  - Inici: index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - tables
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_nums: true
  - pymdownx.tabbed:
      alternate_style: true
